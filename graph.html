<script>
(function(){
var D=JSON.parse(document.getElementById('data').textContent),R=D.nodes,URL0=D.url||'#';
var cv=document.getElementById('c'),cx=cv.getContext('2d'),W=0,H=0,dpr=1;
var REDUCE=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
document.getElementById('back').href='/';
var seed=11;function rand(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(rand()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function rgba(h,a){var n=parseInt(h.slice(1),16);return 'rgba('+(n>>16)+','+(n>>8&255)+','+(n&255)+','+a+')';}

/* ---------- dossiers ---------- */
var PAL=['#FFFFFF','#8F8F96','#E6E6E8','#797980','#D2D2D6','#A6A6AC','#F2F2F4','#8A8A90','#C4C4C9','#B0B0B6','#6E6E75'];
var CODES={'01':'BASE','02':'ICT','03':'METH','04':'FLOW','05':'SESS','06':'FOND','07':'NEWS','08':'RISK','09':'PSYC','10':'JRNL','11':'DEBU'};
var SHORTP={'BASE':'BASES','SESS':'SESSIONS','FOND':'FONDAMENT.','NEWS':'ANNONCES','RISK':'RISQUE','JRNL':'JOURNAL','DEBU':'DÉBUTER','METH':'MÉTHODE','PSYC':'PSYCHO','FLOW':'ORDERFLOW','ICT':'ICT & SMC','HOME':'ACCUEIL'};
function tagText(f){var t=(port&&SHORTP[f.code])?SHORTP[f.code]:f.label;t=t.toUpperCase();var m=port?13:24;if(t.length>m)t=t.slice(0,m-1)+'…';return t;}
var F=[],FI={};
R.forEach(function(n,i){
  var top=(n.folder||'').split('/')[0],key=top||'Accueil';
  if(!(key in FI)){
    var m=/^(\d+) - (.*)$/.exec(key),num=m?parseInt(m[1],10):0;
    FI[key]=F.length;
    F.push({key:key,label:m?m[2]:key,code:m?(CODES[m[1]]||key.slice(5,9).toUpperCase()):'HOME',col:m?PAL[(num-1)%PAL.length]:'#FFFFFF',nodes:[],e:0,cnt:0});
  }
  n.f=FI[key];F[n.f].nodes.push(i);
});
var N=R.length,adj=[],deg=new Array(N),i0;
for(i0=0;i0<N;i0++)adj.push([]);
var LK=[];
R.forEach(function(n,i){(n.links||[]).forEach(function(j){if(j===i||j<0||j>=N)return;if(adj[i].indexOf(j)<0){adj[i].push(j);adj[j].push(i);LK.push([Math.min(i,j),Math.max(i,j)]);}});});
for(i0=0;i0<N;i0++)deg[i0]=adj[i0].length;

/* ---------- placement relatif dans chaque dossier (une seule fois) ---------- */
var rel=new Array(N);
F.forEach(function(f){
  var ids=f.nodes,p={};
  ids.forEach(function(i){var u=rand()*2-1,t=rand()*6.283,s=Math.sqrt(1-u*u),r=Math.cbrt(rand());p[i]=[s*Math.cos(t)*r,u*r,s*Math.sin(t)*r];});
  for(var it=0;it<110;it++){
    var fo={};ids.forEach(function(i){fo[i]=[0,0,0];});
    for(var a=0;a<ids.length;a++)for(var b=a+1;b<ids.length;b++){
      var A=ids[a],B=ids[b],dx=p[A][0]-p[B][0],dy=p[A][1]-p[B][1],dz=p[A][2]-p[B][2],d2=dx*dx+dy*dy+dz*dz+0.01,k=Math.min(0.5,0.012/d2),d=Math.sqrt(d2);
      fo[A][0]+=dx/d*k;fo[A][1]+=dy/d*k;fo[A][2]+=dz/d*k;fo[B][0]-=dx/d*k;fo[B][1]-=dy/d*k;fo[B][2]-=dz/d*k;
    }
    ids.forEach(function(A){adj[A].forEach(function(B){if(R[B].f!==R[A].f)return;var dx=p[B][0]-p[A][0],dy=p[B][1]-p[A][1],dz=p[B][2]-p[A][2],d=Math.sqrt(dx*dx+dy*dy+dz*dz)+1e-4,k=(d-0.3)*0.012;fo[A][0]+=dx/d*k;fo[A][1]+=dy/d*k;fo[A][2]+=dz/d*k;});
      fo[A][0]-=p[A][0]*0.03;fo[A][1]-=p[A][1]*0.03;fo[A][2]-=p[A][2]*0.03;});
    ids.forEach(function(A){p[A][0]+=fo[A][0];p[A][1]+=fo[A][1];p[A][2]+=fo[A][2];});
  }
  var mx=0.001;ids.forEach(function(A){mx=Math.max(mx,Math.hypot(p[A][0],p[A][1],p[A][2]));});
  ids.forEach(function(A){rel[A]=[p[A][0]/mx,p[A][1]/mx,p[A][2]/mx];});
});

/* ---------- cerveau : nuage de points ---------- */
var BR=[],BRC=[];
(function(){
  var s0=seed;seed=5;
  function add(x,y,z,sh){BR.push([x,y,z,rand()*6.283,sh]);}
  var n=0;
  while(n<2700){
    var u=rand()*2-1,t=rand()*6.283,s=Math.sqrt(1-u*u),x=s*Math.cos(t),y=u,z=s*Math.sin(t),h=z>=0?1:-1;
    var g=1+0.075*Math.sin(x*7+y*5)*Math.cos(z*6+x*3)+0.045*Math.sin(y*13+z*9)+0.03*Math.sin(x*21-z*17);
    var px=x*1.6*g,py=y*1.08*g,pz=z*0.82*g;
    if(py<-0.6)py=-0.6+(py+0.6)*0.22;
    pz+=h*0.09;
    if(Math.abs(pz)<0.13&&py>-0.2)continue;
    var sul=0.5+0.5*Math.sin(px*9+py*7+Math.sin(pz*8)*2);
    add(px,py,pz,sul);n++;
  }
  for(var q=0;q<560;q++){var u2=rand()*2-1,t2=rand()*6.283,s2=Math.sqrt(1-u2*u2);add(-0.85+s2*Math.cos(t2)*0.6,-0.82+u2*0.34,s2*Math.sin(t2)*0.52,0.5+0.5*Math.sin(u2*28));}
  for(var q2=0;q2<150;q2++){var tt=rand()*6.283,rr=Math.sqrt(rand())*0.2;add(-0.15+Math.cos(tt)*rr,-0.75-rand()*0.75,Math.sin(tt)*rr,0.6);}
  for(var c=0;c<190;c++){var a=BR[Math.floor(rand()*2700)],b=BR[Math.floor(rand()*2700)],d=Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]);if(d>0.5&&d<1.1)BRC.push([a,b]);}
  seed=s0;
})();
var BRF=BR.filter(function(p){return p[0]>0.55&&p[1]>-0.55;});


/* ---------- scène ---------- */
var port=false,BX=-6,CX=3.8,Hh=7.6,BS=1,LW=150,FOC=16,FIL=[],NP=[],SX=new Float32Array(N),SY=new Float32Array(N),SR=new Float32Array(N),SZ=new Float32Array(N);
function build(){
  var s0=seed;seed=23;
  port=H>W*1.05;BX=port?-3.7:-6.1;CX=port?2.4:3.8;Hh=port?16:7.6;BS=port?0.85:1;
  var nF=F.length;
  F.forEach(function(f,k){
    f.cx=CX+Math.cos(k*1.3)*0.25;f.cy=Hh/2-k*Hh/(nF-1);f.cz=Math.sin(k*1.9)*0.8;
    f.r=Math.min(1.3,0.36+0.19*Math.sqrt(f.nodes.length));f.ry=Math.min(f.r*0.6,Hh/(nF-1)*0.7);
  });
  for(var i=0;i<N;i++){var f=F[R[i].f];NP[i]=[f.cx+rel[i][0]*f.r,f.cy+rel[i][1]*f.ry,f.cz+rel[i][2]*f.r*0.8];}
  FIL=[];
  F.forEach(function(f,k){
    var K=Math.max(4,Math.min(12,3+Math.round(f.nodes.length/5))),ord=shuffle(f.nodes.slice());
    for(var q=0;q<K;q++){
      var ni=ord[q%ord.length],b=BRF[Math.floor(rand()*BRF.length)];
      var S=[BX+b[0]*BS,b[1]*BS,b[2]*BS],E=NP[ni],dx=E[0]-S[0];
      var c1=[S[0]+dx*0.32,S[1]+(rand()-0.5)*2.6,S[2]+(rand()-0.5)*2.4];
      var c2=[E[0]-dx*0.3,E[1]+(rand()-0.5)*1.2,E[2]+(rand()-0.5)*1.4];
      var P=new Float32Array(34*3);
      for(var s=0;s<=33;s++){var t=s/33,u=1-t,w0=u*u*u,w1=3*u*u*t,w2=3*u*t*t,w3=t*t*t;
        P[s*3]=w0*S[0]+w1*c1[0]+w2*c2[0]+w3*E[0];P[s*3+1]=w0*S[1]+w1*c1[1]+w2*c2[1]+w3*E[1];P[s*3+2]=w0*S[2]+w1*c1[2]+w2*c2[2]+w3*E[2];}
      FIL.push({k:k,n:ni,P:P});
    }
  });
  seed=s0;
}

/* ---------- caméra ---------- */
var yawU=0,pit=-0.1,vyaw=0,zoom=1,tzoom=1,pv=[0,0,0],tpv=[0,0,0],oxC=0,toxC=0,focusK=-1,cYaw=1,sYaw=0,cPit=1,sPit=0,SC=20,SC0=20,T=0,tmp={x:0,y:0,k:1,z:0};
function measureLW(){var c=cx,fs=port?9.5:11.5,pad=port?5:7,mx=0;c.font='700 '+fs+'px "JetBrains Mono",ui-monospace,monospace';
  F.forEach(function(f){var t=tagText(f);var w=c.measureText(f.code).width+pad*1.5+c.measureText(t).width+pad*2;if(w>mx)mx=w;});
  LW=mx+(port?18:30)+(port?0:62);}
function layoutCam(){
  measureLW();var spanX=(CX+1.35)-(BX-1.9),a=(W-30-LW)/spanX,b=(H*0.74)/(Hh+1.8);
  SC0=port?a:Math.min(a,b);
}
function defaultCenter(){tpv=[(BX+CX)/2-0.2,0,0];toxC=(W-LW)/2+(port?4:8);}
function P(x,y,z){
  x-=pv[0];y-=pv[1];z-=pv[2];
  var x1=x*cYaw+z*sYaw,z1=-x*sYaw+z*cYaw,y1=y*cPit-z1*sPit,z2=y*sPit+z1*cPit,k=FOC/(FOC+z2);
  tmp.x=oxC+x1*SC*k;tmp.y=H*(port?0.48:0.5)-y1*SC*k;tmp.k=k;tmp.z=z2;
}

/* ---------- état ---------- */
var sel=-1,hov=-1,query='',vis=new Float32Array(N),tvis=new Float32Array(N),nE=new Float32Array(N),rings=[],floats=[],packets=[],recent=[],sent=0,bE=0,acc=0,burstT=4,labRects=[],stars=[];
for(var si=0;si<N;si++){vis[si]=1;tvis[si]=1;}
for(var s1=0;s1<240;s1++)stars.push([rand(),rand(),0.2+rand()*0.8,rand()*6.28,rand()<0.12?1.6:1]);
var spr={};
function sprite(col){if(spr[col])return spr[col];var c=document.createElement('canvas');c.width=c.height=64;var g=c.getContext('2d'),r=g.createRadialGradient(32,32,0,32,32,32);r.addColorStop(0,rgba(col,1));r.addColorStop(0.18,rgba(col,0.55));r.addColorStop(0.5,rgba(col,0.14));r.addColorStop(1,rgba(col,0));g.fillStyle=r;g.fillRect(0,0,64,64);spr[col]=c;return c;}
F.forEach(function(f){sprite(f.col);});sprite('#FFFFFF');
function launch(fi,delay){var sp=0.34+rand()*0.24;packets.push({fi:fi,t:-(delay||0)*sp,sp:sp});}
function arrive(p){
  var fl=FIL[p.fi],f=F[fl.k],n=fl.n;
  nE[n]=1;f.e=Math.min(1.4,f.e+0.55);f.cnt++;sent++;
  rings.push({n:n,a:0});
  if(floats.length<6&&rand()<0.5)floats.push({n:n,a:0});
  recent.unshift(R[n].name);if(recent.length>15)recent.length=15;

var tkEl=document.getElementById('tk');
var weights=[],wsum=0;
function setupWeights(){weights=FIL.map(function(f){return F[f.k].nodes.length+4;});wsum=weights.reduce(function(a,b){return a+b;},0);}
function pickFil(){var r=rand()*wsum,i=0;while(i<weights.length-1&&r>weights[i]){r-=weights[i];i++;}return i;}

/* ---------- taille ---------- */
function resize(){
  var wasPort=port;dpr=Math.min(window.devicePixelRatio||1,2.5);W=window.innerWidth;H=window.innerHeight;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);

  if(np!==wasPort||!FIL.length){port=np;build();packets=[];setupWeights();}

}

/* ---------- sélection / recherche / focus ---------- */
var card=document.getElementById('card'),tip=document.getElementById('tip'),qEl=document.getElementById('q'),rst=document.getElementById('rst');

  if(query){for(i=0;i<N;i++){if(R[i].name.toLowerCase().indexOf(query)>=0)tvis[i]=1;else if(focusK<0)tvis[i]=0.1;}}
  if(sel>=0){tvis[sel]=1;adj[sel].forEach(function(j){tvis[j]=1;});}
}
function select(i){
  sel=i;
  if(i>=0){var n=R[i],f=F[n.f];card.querySelector('.f').textContent=f.code+' · '+f.label+' · '+deg[i]+' lien'+(deg[i]>1?'s':'');card.querySelector('.f').style.color=f.col;card.querySelector('h2').textContent=n.name;card.querySelector('p').textContent=(n.snip&&!/^Retour/.test(n.snip))?n.snip:'';card.querySelector('a.btn').href=URL0+'#note-'+n.id;card.classList.add('show');}
  else card.classList.remove('show');
  applyVis();
}

  focusK=k;var f=F[k];tpv=[f.cx,f.cy,f.cz];toxC=W*(port?0.34:0.38);tzoom=port?2.4:2.7;rst.classList.add('show');applyVis();
}
document.getElementById('cl').onclick=function(){select(-1);};
rst.onclick=function(){select(-1);focusF(-1);};
qEl.addEventListener('input',function(){query=qEl.value.trim().toLowerCase();applyVis();});
qEl.addEventListener('keydown',function(e){if(e.key==='Enter'&&query){for(var i=0;i<N;i++)if(R[i].name.toLowerCase().indexOf(query)>=0){select(i);focusF(R[i].f);break;}qEl.blur();}});

/* ---------- pointeur ---------- */
var ptr={},pinch0=0,pz0=1,mv=0,t0=0,lastX=0,lastY=0;
cv.addEventListener('pointerdown',function(e){cv.setPointerCapture(e.pointerId);ptr[e.pointerId]={x:e.clientX,y:e.clientY};var ks=Object.keys(ptr);if(ks.length===2){var a=ptr[ks[0]],b=ptr[ks[1]];pinch0=Math.hypot(a.x-b.x,a.y-b.y);pz0=tzoom;}mv=0;t0=performance.now();lastX=e.clientX;lastY=e.clientY;cv.classList.add('dr');vyaw=0;});

  var p=ptr[e.pointerId];

  var ks=Object.keys(ptr);
  if(ks.length===2){p.x=e.clientX;p.y=e.clientY;var a=ptr[ks[0]],b=ptr[ks[1]],d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch0>0){tzoom=Math.max(0.6,Math.min(5,pz0*d/pinch0));}mv=99;return;}
  var dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;mv+=Math.abs(dx)+Math.abs(dy);
  if(mv>6){yawU+=dx*0.006;vyaw=dx*0.006;pit=Math.max(-0.7,Math.min(0.7,pit+dy*0.004));}
});
function up(e){
  var had=ptr[e.pointerId];delete ptr[e.pointerId];pinch0=0;cv.classList.remove('dr');
  if(had&&mv<7&&performance.now()-t0<500&&Object.keys(ptr).length===0)tap(e.clientX,e.clientY);
}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',function(e){delete ptr[e.pointerId];cv.classList.remove('dr');});
cv.addEventListener('wheel',function(e){e.preventDefault();tzoom=Math.max(0.6,Math.min(5,tzoom*Math.exp(-e.deltaY*0.0012)));},{passive:false});
cv.addEventListener('dblclick',function(){select(-1);focusF(-1);yawU=0;pit=-0.1;});
function pickNode(x,y){var best=-1,bd=1e9,i;for(i=0;i<N;i++){if(vis[i]<0.3)continue;var d=Math.hypot(SX[i]-x,SY[i]-y),lim=Math.max(15,SR[i]+9);if(d<lim){var sc=d+SZ[i]*0.5;if(sc<bd){bd=sc;best=i;}}}return best;}
function pickLabel(x,y){for(var i=0;i<labRects.length;i++){var r=labRects[i];if(x>=r[0]&&x<=r[2]&&y>=r[1]&&y<=r[3])return r[4];}return -1;}
function tap(x,y){var l=pickLabel(x,y);if(l>=0){focusF(l);return;}var n=pickNode(x,y);if(n>=0){select(n);return;}select(-1);}
function hover(x,y){if(!T)return;var n=pickNode(x,y),l=n<0?pickLabel(x,y):-1;hov=n;cv.classList.toggle('pt',n>=0||l>=0);
  if(n>=0){tip.textContent=R[n].name;tip.style.left=Math.min(W-tip.offsetWidth-8,x+14)+'px';tip.style.top=(y+14)+'px';tip.style.opacity=1;}else tip.style.opacity=0;}

/* ---------- boucle ---------- */
var last=0;
function frame(ts){
  requestAnimationFrame(frame);
  var dt=Math.min(0.05,(ts-last)/1000||0.016);last=ts;T+=dt;
  /* caméra */
  if(!Object.keys(ptr).length){yawU+=vyaw;vyaw*=0.93;}
  var k=Math.min(1,dt*4.5);
  zoom+=(tzoom-zoom)*k;oxC+=(toxC-oxC)*k;for(var a=0;a<3;a++)pv[a]+=(tpv[a]-pv[a])*k;
  var yaw=yawU+(REDUCE?0:Math.sin(T*0.22)*0.15);
  cYaw=Math.cos(yaw);sYaw=Math.sin(yaw);cPit=Math.cos(pit);sPit=Math.sin(pit);SC=SC0*zoom;
  /* envoi des ressources */
  acc+=dt;var iv=(REDUCE?0.5:0.15);
  while(acc>iv){acc-=iv;if(packets.length<90){launch(pickFil(),0);bE=Math.min(1,bE+0.1);}}
  burstT-=dt;if(burstT<0){burstT=5+rand()*4;var bk=Math.floor(rand()*F.length),dl=0;FIL.forEach(function(f,i){if(f.k===bk){launch(i,dl);dl+=0.07;}});bE=1;}
  for(var p=packets.length-1;p>=0;p--){var pk=packets[p];pk.t+=pk.sp*dt;if(pk.t>=1){arrive(pk);packets.splice(p,1);}}
  bE=Math.max(0,bE-dt*0.7);
  for(var i=0;i<N;i++){nE[i]=Math.max(0,nE[i]-dt*0.9);vis[i]+=(tvis[i]-vis[i])*Math.min(1,dt*7);}
  F.forEach(function(f){f.e=Math.max(0,f.e-dt*0.9);});
  for(var r=rings.length-1;r>=0;r--){rings[r].a+=dt*1.5;if(rings[r].a>=1)rings.splice(r,1);}
  for(var q=floats.length-1;q>=0;q--){floats[q].a+=dt*0.7;if(floats[q].a>=1)floats.splice(q,1);}
  draw();
}

function draw(){
  var c=cx;c.setTransform(dpr,0,0,dpr,0,0);c.globalCompositeOperation='source-over';c.globalAlpha=1;
  c.fillStyle='#0C0C0D';c.fillRect(0,0,W,H);
  var intro=Math.min(1,T/1.4),i,j;
  /* étoiles */
  c.globalCompositeOperation='lighter';
  for(i=0;i<stars.length;i++){var s=stars[i],tw=0.45+0.55*Math.sin(T*1.3*s[2]+s[3]),x=((s[0]*W+yawU*30*s[2]*s[2])%W+W)%W,y=s[1]*H;c.globalAlpha=(0.25+0.6*tw)*s[2]*intro;c.fillStyle='#fff';var z=s[4]*(s[2]>0.7?1.5:1);c.fillRect(x,y,z,z);}
  /* halo du cerveau */

  var gr=3.6*BS*SC*bk,g=sprite('#FFFFFF');
  c.globalAlpha=(0.10+0.22*bE)*intro;c.drawImage(g,bx-gr,by-gr,gr*2,gr*2);
  /* cerveau */
  var wv=T*1.7,sw=BS,pr;
    for(i=0;i<BR.length;i++){
    var b2=BR[i];
    P(BX+b2[0]*sw,b2[1]*sw,b2[2]*sw);
    var f1=0.5+0.5*Math.sin(T*2+b2[3]),hot=Math.pow(Math.max(0,Math.sin(wv-b2[0]*1.8)),8),al=(0.2+0.42*f1*(0.4+0.6*b2[4])+0.55*hot*0.8+0.4*bE*b2[4])*0.8*(port?0.75:1)*intro*Math.min(1,0.55+tmp.k*0.5);
    c.globalAlpha=al>1?1:al;
    var sz=(0.9+0.9*tmp.k)*(SC/20>1?Math.min(1.9,SC/20):1)*(1+hot*0.6);
    c.fillStyle=b2[1]>0.45?'rgb(255,255,255)':(b2[4]>0.55?'rgb(205,205,210)':'rgb(150,150,156)');
    c.fillRect(tmp.x-sz/2,tmp.y-sz/2,sz,sz);
  }
  c.lineWidth=0.7;c.strokeStyle='rgb(230,230,235)';
  for(i=0;i<BRC.length;i++){var ch=BRC[i],hw=Math.pow(Math.max(0,Math.sin(wv-ch[0][0]*1.8)),6);c.globalAlpha=(0.05+0.55*hw+0.25*bE*(i%3===0?1:0))*intro;P(BX+ch[0][0]*sw,ch[0][1]*sw,ch[0][2]*sw);var ax=tmp.x,ay=tmp.y;P(BX+ch[1][0]*sw,ch[1][1]*sw,ch[1][2]*sw);c.beginPath();c.moveTo(ax,ay);c.lineTo(tmp.x,tmp.y);c.stroke();}
  /* liens entre notes */
  var kf;
  for(var pass=0;pass<2;pass++){
    for(kf=0;kf<F.length;kf++){
      c.beginPath();var any=false;
      for(i=0;i<LK.length;i++){var A=LK[i][0],B=LK[i][1];if(R[A].f!==kf)continue;var same=R[A].f===R[B].f;if((pass===0)!==same)continue;if(vis[A]<0.2&&vis[B]<0.2)continue;P(NP[A][0],NP[A][1],NP[A][2]);var x1=tmp.x,y1=tmp.y;P(NP[B][0],NP[B][1],NP[B][2]);c.moveTo(x1,y1);c.lineTo(tmp.x,tmp.y);any=true;}
      if(any){c.strokeStyle=F[kf].col;c.lineWidth=0.6;c.globalAlpha=(pass===0?0.06:0.2)*intro*(sel>=0||query||focusK>=0?0.7:1);c.stroke();}
    }
  }
  /* liens chauds : note qui vient de recevoir ou sélection */
  c.lineWidth=1.1;
  for(i=0;i<N;i++){var he=Math.max(nE[i],i===sel?0.9:0,i===hov?0.6:0);if(he<0.05)continue;c.strokeStyle=F[R[i].f].col;c.globalAlpha=he*0.7;c.beginPath();P(NP[i][0],NP[i][1],NP[i][2]);var hx=tmp.x,hy=tmp.y;for(j=0;j<adj[i].length;j++){var o=adj[i][j];P(NP[o][0],NP[o][1],NP[o][2]);c.moveTo(hx,hy);c.lineTo(tmp.x,tmp.y);}c.stroke();}
  /* filaments */
  var dim=(sel>=0||query||focusK>=0);
  for(i=0;i<FIL.length;i++){
    var fl=FIL[i],fk=F[fl.k],Pp=fl.P;
    var fa=dim&&focusK>=0&&fl.k!==focusK?0.12:(dim&&sel>=0&&R[sel].f!==fl.k?0.2:1);
    c.beginPath();
    for(j=0;j<=33;j++){P(Pp[j*3],Pp[j*3+1],Pp[j*3+2]);if(j===0){c.moveTo(tmp.x,tmp.y);var sx0=tmp.x,sy0=tmp.y;}else c.lineTo(tmp.x,tmp.y);}
    var gg=c.createLinearGradient(sx0,sy0,tmp.x,tmp.y);gg.addColorStop(0,rgba(fk.col,0.5));gg.addColorStop(1,rgba(fk.col,0.2+0.35*fk.e));
    c.strokeStyle=gg;c.lineWidth=0.9+0.8*Math.min(1,fk.e);c.globalAlpha=fa*intro;c.stroke();
  }
  /* paquets en route */
  for(i=0;i<packets.length;i++){
    var pk=packets[i];if(pk.t<0)continue;var fl2=FIL[pk.fi],col=F[fl2.k].col,Q=fl2.P;
    if(dim&&focusK>=0&&fl2.k!==focusK)continue;
    var tt=Math.min(pk.t,1);
    c.beginPath();var tr=9,hx2=0,hy2=0,hk=1;
    for(j=0;j<=tr;j++){var tq=Math.max(0,tt-(tr-j)*0.014),f=tq*33,i1=Math.floor(f),fr=f-i1,i2=Math.min(33,i1+1);
      P(Q[i1*3]*(1-fr)+Q[i2*3]*fr,Q[i1*3+1]*(1-fr)+Q[i2*3+1]*fr,Q[i1*3+2]*(1-fr)+Q[i2*3+2]*fr);
      if(j===0)c.moveTo(tmp.x,tmp.y);else c.lineTo(tmp.x,tmp.y);hx2=tmp.x;hy2=tmp.y;hk=tmp.k;}
    c.strokeStyle=col;c.lineWidth=2.2*Math.max(0.7,hk);c.globalAlpha=0.9;c.lineCap='round';c.stroke();
    var gs=sprite(col),r2=9*Math.max(0.8,hk)*(SC/20>1.3?1.3:1);c.globalAlpha=1;c.drawImage(gs,hx2-r2,hy2-r2,r2*2,r2*2);
    c.fillStyle='#fff';c.globalAlpha=0.95;c.fillRect(hx2-1.1,hy2-1.1,2.2,2.2);
  }
  /* notes */
  var order=[];for(i=0;i<N;i++){P(NP[i][0],NP[i][1],NP[i][2]);SX[i]=tmp.x;SY[i]=tmp.y;SZ[i]=tmp.z;SR[i]=Math.max(1.3,Math.min(6.5,(1.25+0.48*Math.sqrt(deg[i]))*(SC/21)*tmp.k));order.push(i);}
  order.sort(function(a,b){return SZ[b]-SZ[a];});
  for(var oi=0;oi<N;oi++){
    i=order[oi];var nf=F[R[i].f],v=vis[i],e=Math.max(nE[i],i===sel?1:0,i===hov?0.7:0),gs2=sprite(nf.col),rr=SR[i]*(1+e*0.8);
    if(e>0.03){var gR=rr*(4+e*2.5);c.globalAlpha=Math.min(1,e)*0.75*v;c.drawImage(gs2,SX[i]-gR,SY[i]-gR,gR*2,gR*2);}
    c.globalAlpha=(0.1+0.26*Math.min(1,0.4+SR[i]/5))*v*intro;c.drawImage(gs2,SX[i]-rr*2.1,SY[i]-rr*2.1,rr*4.2,rr*4.2);
    c.globalAlpha=(0.55+0.45*Math.min(1,e*2))*v*intro;c.fillStyle=e>0.5?'#fff':nf.col;c.beginPath();c.arc(SX[i],SY[i],rr,0,6.283);c.fill();
  }
  /* anneaux d'arrivée */
  c.lineWidth=1.4;
  for(i=0;i<rings.length;i++){var rg=rings[i],n=rg.n;c.strokeStyle=F[R[n].f].col;c.globalAlpha=(1-rg.a)*0.85;c.beginPath();c.arc(SX[n],SY[n],SR[n]+3+rg.a*26*(SC/21>1?Math.min(1.6,SC/21):1),0,6.283);c.stroke();}
  /* étiquettes */
  c.globalCompositeOperation='source-over';c.textBaseline='middle';
  var fs=port?9.5:11.5,pad=port?5:7,hgt=fs+9;c.font='700 '+fs+'px "JetBrains Mono",ui-monospace,monospace';
  labRects=[];
  for(var k2=0;k2<F.length;k2++){
    var f2=F[k2];P(f2.cx,f2.cy,f2.cz);var rx=f2.r*SC*tmp.k*0.95+(port?8:14),lx=tmp.x+rx,ly=tmp.y;
    var code=f2.code,cw=c.measureText(code).width+pad*1.5,txt=tagText(f2);
    var tw2=c.measureText(txt).width,w=cw+tw2+pad*2;
    var dimF=(focusK>=0&&k2!==focusK)||(sel>=0&&R[sel].f!==k2)?0.35:1,fe=Math.min(1,f2.e);
    c.globalAlpha=dimF*intro;
    c.shadowColor=f2.col;c.shadowBlur=fe*16;
    c.fillStyle='rgba(12,12,13,0.82)';c.fillRect(lx,ly-hgt/2,w,hgt);
    c.lineWidth=1.3+fe*0.8;c.strokeStyle=f2.col;c.strokeRect(lx+0.5,ly-hgt/2+0.5,w-1,hgt-1);
    c.shadowBlur=0;
    c.fillStyle=f2.col;c.fillRect(lx,ly-hgt/2,cw,hgt);c.fillStyle='#0C0C0D';c.fillText(code,lx+pad*0.75,ly+0.5);
    c.fillStyle=fe>0.4?'#fff':f2.col;c.fillText(txt,lx+cw+pad,ly+0.5);
    labRects.push([lx,ly-hgt/2,lx+w,ly+hgt/2,k2]);
    if(!port&&zoom<1.6){c.globalAlpha=0.5*dimF;c.font='400 9.5px "JetBrains Mono",ui-monospace,monospace';c.fillStyle='#8A8A90';c.fillText(f2.nodes.length+' notes',lx+w+8,ly+0.5);c.font='700 '+fs+'px "JetBrains Mono",ui-monospace,monospace';}
  }
  /* étiquette du cerveau */
  P(BX,-1.9*BS,0);var tx=tmp.x,ty=tmp.y+(port?6:10);c.globalAlpha=intro;
  var bl='CERVEAU',bw=c.measureText('CORE').width+pad*1.5,blw=c.measureText(bl).width;
  c.shadowColor='#FFFFFF';c.shadowBlur=4+bE*14;c.fillStyle='rgba(12,12,13,0.85)';c.fillRect(tx-(bw+blw+pad*2)/2,ty-hgt/2,bw+blw+pad*2,hgt);c.strokeStyle='#E6E6E8';c.lineWidth=1.3;c.strokeRect(tx-(bw+blw+pad*2)/2+0.5,ty-hgt/2+0.5,bw+blw+pad*2-1,hgt-1);c.shadowBlur=0;
  c.fillStyle='#FFFFFF';c.fillRect(tx-(bw+blw+pad*2)/2,ty-hgt/2,bw,hgt);c.fillStyle='#0C0C0D';c.fillText('CORE',tx-(bw+blw+pad*2)/2+pad*0.75,ty+0.5);c.fillStyle='#FFFFFF';c.fillText(bl,tx-(bw+blw+pad*2)/2+bw+pad,ty+0.5);
  /* noms : sélection, voisins, recherche, dossier en focus, arrivées */
  c.font='400 '+(port?8.5:10)+'px "JetBrains Mono",ui-monospace,monospace';
  var placed=[];
  function lab(n,al,strong){var nm=R[n].name;if(nm.length>26)nm=nm.slice(0,25)+'…';var w3=c.measureText(nm).width,x=SX[n]+SR[n]+5,y=SY[n]-SR[n]-4;
    for(var u=0;u<placed.length;u++){var pr2=placed[u];if(x<pr2[2]&&x+w3>pr2[0]&&Math.abs(y-pr2[1])<11)return;}
    placed.push([x,y,x+w3,y]);c.globalAlpha=al;c.fillStyle=strong?'#fff':F[R[n].f].col;c.fillText(nm,x,y);}
  if(sel>=0){lab(sel,1,true);adj[sel].forEach(function(n){lab(n,0.85,false);});}
  else if(query){var cn=0;for(i=0;i<N&&cn<30;i++){if(R[i].name.toLowerCase().indexOf(query)>=0){lab(i,1,true);cn++;}}}
  else if(focusK>=0||zoom>2){F[focusK>=0?focusK:0].nodes.forEach(function(n){lab(n,0.8*vis[n],false);});}
  for(i=0;i<floats.length;i++){var fo=floats[i],n2=fo.n,nm2=R[n2].name;if(nm2.length>24)nm2=nm2.slice(0,23)+'…';var al=Math.sin(Math.min(1,fo.a)*3.14159);c.globalAlpha=al*0.95*vis[n2];c.fillStyle=F[R[n2].f].col;c.fillText('+ '+nm2,SX[n2]+SR[n2]+6,SY[n2]-8-fo.a*14);}
  c.globalAlpha=1;
}
window.addEventListener('resize',function(){resize();});
resize();requestAnimationFrame(frame);
window.__brain={sel:function(i){select(i);},focus:function(k){focusF(k);},F:F,N:N};
})();
